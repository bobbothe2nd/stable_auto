[package]
name = "stable_auto"
description = "Simulating `auto trait`s on stable Rust through blanket `impl`s"
version = "0.1.0"
rust-version = "1.50"
edition = "2018"

[features]
default = ["std"]

std = ["alloc"]
alloc = []

[dependencies]
stable_auto_macros = { version = "0.1.0", path = "../stable_auto_macros" }

[build-dependencies]
rust-ver = "0.1.3"
